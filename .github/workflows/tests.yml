name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      # AlertaBlu.Tests only references the plain net10.0 libraries (Domain, Application,
      # Infrastructure, Presentation) — no MAUI workload needed to build or run it.
      - name: Restore
        run: dotnet restore AlertaBlu.Tests/AlertaBlu.Tests.csproj

      - name: Test
        run: dotnet test AlertaBlu.Tests/AlertaBlu.Tests.csproj --configuration Release --no-restore
